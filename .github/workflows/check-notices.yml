# notices.json(공지사항)과 releases.json(업데이트 내역)을 고치면 형식이 맞는지 확인한다.
# 틀리면 Actions 탭에 빨간 X가 뜨고, 무엇이 틀렸는지 알려준다. (앱은 틀린 파일을 무시하고 마지막으로 받은 내용을 써요)

name: 공지사항·업데이트 내역 확인

on:
  push:
    paths:
      - "notices.json"
      - "releases.json"
      - "check_notices.py"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write   # 형식이 틀리면 이슈로 알리기 위해

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 형식 확인
        run: python3 check_notices.py

      - name: 틀렸으면 알리기
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "notices.json 또는 releases.json 형식이 틀렸어요. 앱은 틀린 파일을 무시하고 마지막으로 받은 내용을 써요."
            echo
            echo "무엇이 틀렸는지: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "고쳐서 다시 올리면 확인이 다시 돌아요. 통과하면 이 이슈를 닫아 주세요."
            echo
            echo "cc @${{ github.repository_owner }}"
          } | bash .github/notify.sh "공지사항·업데이트 내역 형식 오류"
