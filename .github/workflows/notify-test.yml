# 관리자 알림(이슈)이 잘 오는지 시험한다. Actions 탭 > "관리자 알림 시험" > Run workflow
# 이슈가 생기고 메일·GitHub 앱 알림이 오면 정상. 확인 후 이슈는 닫으면 된다.
name: 관리자 알림 시험

on:
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 시험 이슈 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "관리자 알림 시험이에요. 이 이슈가 보이고 알림이 왔다면 정상이에요. 확인했으면 닫아 주세요."
            echo
            echo "cc @${{ github.repository_owner }}"
          } | bash .github/notify.sh "관리자 알림 시험"
