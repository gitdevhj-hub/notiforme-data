# 매달 공공데이터포털에서 주정차 정보를 받아 parking-info.json을 새로 만든다.
# 앱은 이 저장소의 parking-info.json을 내려받아 쓴다.
#
# 필요한 것: 저장소 Settings > Secrets and variables > Actions 에 DATA_GO_KR_KEY (공공데이터포털 Decoding 인증키)
# 바로 돌려 보기: Actions 탭 > "주정차 정보 데이터 갱신" > Run workflow

name: 주정차 정보 데이터 갱신

on:
  schedule:
    # 매달 2일 오전 4시 7분 (한국 시간). cron은 UTC 기준이라 1일 19:07
    - cron: "7 19 1 * *"
  workflow_dispatch: {}
  # 표준노드링크(Release "nodelink")를 새로 올리면 도로 파일을 다시 만든다.
  release:
    types: [published, edited]
  # CCTV 파일(sources/cctv.json)이나 스크립트를 새로 올리면 바로 다시 만든다.
  push:
    paths:
      - "sources/**"
      - "fetch_parking_info.py"
      - "build_roads.py"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write   # 새 파일을 이 저장소에 올리기 위해
  issues: write     # 실패하거나 주의할 일이 있으면 이슈로 알리기 위해

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 표준노드링크 받기 (Release "nodelink"의 zip, 없으면 건너뜀)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download nodelink --pattern "*.zip" --dir nodelink || echo "도로망 파일이 없어요."

      - name: 공공데이터 받아서 JSON 만들기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          # API 주소가 기본값과 다르면 저장소 Variables에 넣는다. (없으면 스크립트 기본값)
          SCHOOL_API: ${{ vars.SCHOOL_API }}
          PARKING_API: ${{ vars.PARKING_API }}
          CAMERA_API: ${{ vars.CAMERA_API }}
        run: python3 fetch_parking_info.py

      - name: 바뀌었으면 올리기
        run: |
          git add -N parking-roads.bin 2>/dev/null || true
          if git diff --quiet -- parking-info.json parking-info-meta.json parking-roads.bin && git ls-files --error-unmatch parking-info-meta.json >/dev/null 2>&1; then
            echo "바뀐 내용이 없어요."
            exit 0
          fi
          git config user.name "notiforme-data-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add parking-info.json parking-info-meta.json
          [ -f parking-roads.bin ] && git add parking-roads.bin
          git commit -m "주정차 정보 데이터 갱신 $(date +%Y-%m-%d)"
          git push

      # 받기는 됐지만 일부가 빠진 경우 (카메라 API 실패로 지난 데이터 사용, 도로 파일 실패 등)
      - name: 주의할 일 알리기
        if: success() && hashFiles('warnings.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "데이터는 갱신했지만 확인할 일이 있어요."
            echo
            sed 's/^/    /' warnings.txt
            echo
            echo "실행 기록: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "cc @${{ github.repository_owner }}"
          } | bash .github/notify.sh "주정차 정보 데이터 갱신: 확인 필요"

      - name: 실패 알리기
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "데이터 갱신이 실패했어요. 앱은 지난 데이터를 그대로 써요."
            echo
            echo "흔한 원인: 공공데이터포털 인증키 만료(활용기간), API 형식 변경, 공공데이터포털 점검"
            echo "실행 기록에서 빨간 단계의 마지막 줄을 확인해 주세요: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "고친 뒤 Actions > 주정차 정보 데이터 갱신 > Run workflow 로 다시 돌리고 이 이슈를 닫아 주세요."
            echo
            echo "cc @${{ github.repository_owner }}"
          } | bash .github/notify.sh "주정차 정보 데이터 갱신 실패"
